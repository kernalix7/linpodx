name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".cargo/audit.toml"
  schedule:
    # Daily at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `cargo deny check` runs all four checks (advisories/bans/licenses/sources).
      # Do NOT pass --workspace/--all-features here: cargo-deny >= 0.18 removed those
      # flags, and `[graph] all-features = true` in deny.toml already covers them.
      # Keeping the argument list empty means CI runs exactly what `cargo deny check`
      # runs locally.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
