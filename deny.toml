# cargo-deny configuration for linpodx
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Documented waivers — each entry MUST carry a rationale comment explaining why
# the advisory does not apply to linpodx's deployment model. Re-evaluate at every
# release: drop a waiver as soon as an upstream fix lands in our dep graph.
ignore = [
    # hickory-proto 0.25.2 — NSEC3 closest-encloser proof DoS on cross-zone responses.
    # The DNSSEC validation path is the only attack surface; linpodx never enables
    # the validating-resolver feature. The egress filter (linpodx-runtime::network_filter)
    # only serves outbound queries from sandbox containers and never returns NSEC3
    # records. Fixed upstream in 0.26.1 but that release rewrites NameServerConfig +
    # removes ResolveError — migration deferred to a future minor.
    "RUSTSEC-2026-0118",
    # hickory-proto 0.25.2 — O(n^2) name compression CPU exhaustion during message
    # ENCODING. Our DNS server only encodes responses to queries coming from sandbox
    # containers (loopback / Podman network), not internet-facing traffic. A malicious
    # container can already exhaust its own egress budget; the attacker would need
    # local container compromise first, after which DoS on the resolver is the least
    # interesting capability. Fix requires 0.26.1.
    "RUSTSEC-2026-0119",
    # backoff 0.4.0 — unmaintained, transitive via kube-runtime. Will resolve when
    # kube bumps to ≥0.99 (drops backoff).
    "RUSTSEC-2025-0012",
    # instant 0.1.13 — unmaintained, transitive via parking_lot 0.11 + backoff. Same
    # resolution path as RUSTSEC-2025-0012.
    "RUSTSEC-2024-0384",
    # paste 1.0.15 — unmaintained, transitive via wasmtime + leptos. Both upstreams
    # are tracking replacement; not in linpodx's direct surface.
    "RUSTSEC-2024-0436",
    # rustls-pemfile 2.2.0 — folded into rustls-pki-types upstream. Migration is
    # mechanical; deferred until kube + axum-server bump.
    "RUSTSEC-2025-0134",
    # serial 0.4.0 — unmaintained since 2017, transitive via portable-pty 0.8.1
    # (interactive `linpodx exec -it`). portable-pty upstream is tracking serialport
    # migration; only the PTY proxy path is affected.
    "RUSTSEC-2017-0008",

    # ---------------------------------------------------------------------------
    # gtk-rs GTK3 bindings (0.18.x) — the whole gtk3-rs family was archived upstream
    # with "No safe upgrade is available!"; gtk4-rs is a different, incompatible ABI.
    # These arrive ONLY through the Tauri 2 desktop shell:
    #   gdkwayland-sys / gdkx11 / gdkx11-sys → tao + wry → tauri-runtime-wry → tauri
    #   atk / atk-sys / gdk / gdk-sys / gtk / gtk-sys / gtk3-macros → gtk → muda + tao
    # WebKitGTK 4.1 (webkit2gtk-4.1) is the only WebKit ABI shipped by every distro we
    # target, and it is a GTK3 library — so GTK3 is load-bearing for linpodx-gui and
    # cannot be dropped without abandoning the Tauri shell (Phase 25 GUI direction).
    # These are "unmaintained" notices, not exploitable vulnerabilities: no CVE, no
    # advisory with a patched range. Re-evaluate when tauri/wry move to WebKitGTK 6
    # (GTK4), at which point every entry below must be deleted.
    "RUSTSEC-2024-0411", # gdkwayland-sys 0.18.2
    "RUSTSEC-2024-0412", # gdk 0.18.2
    "RUSTSEC-2024-0413", # atk 0.18.2
    "RUSTSEC-2024-0414", # gdkx11-sys 0.18.2
    "RUSTSEC-2024-0415", # gtk 0.18.2
    "RUSTSEC-2024-0416", # atk-sys 0.18.2
    "RUSTSEC-2024-0417", # gdkx11 0.18.2
    "RUSTSEC-2024-0418", # gdk-sys 0.18.2
    "RUSTSEC-2024-0419", # gtk3-macros 0.18.2
    "RUSTSEC-2024-0420", # gtk-sys 0.18.2

    # proc-macro-error 1.0.4 — unmaintained, "No safe upgrade is available!".
    # Build-time only (proc-macro dependency of glib-macros 0.18.5, itself part of the
    # GTK3 stack above). Never linked into a shipped binary, so it has no runtime
    # attack surface; it disappears together with the GTK3 waivers.
    "RUSTSEC-2024-0370",
    # proc-macro-error2 2.0.1 — unmaintained (author confirmed 2026-06); the fork of
    # RUSTSEC-2024-0370 is dead too and there is no patched release. Build-time only,
    # via leptos_macro 0.7.9 + reactive_stores_macro (linpodx-webui). Resolution is
    # upstream leptos migrating to manyhow / proc-macro2-diagnostics.
    "RUSTSEC-2026-0173",

    # rust-unic family 0.9.0 — the whole open-i18n/rust-unic org is unmaintained with
    # no patched release. Reached only through urlpattern 0.3.0 → tauri-utils, i.e.
    # Tauri's URL-pattern matcher for its own asset/IPC scheme; linpodx never feeds
    # untrusted URLs into it (the shell loads a fixed localhost origin served by the
    # daemon). Pure Unicode table lookups — no unsafe, no network, no filesystem.
    # Resolution is upstream tauri-utils moving urlpattern onto icu_properties.
    "RUSTSEC-2025-0075", # unic-char-range 0.9.0
    "RUSTSEC-2025-0080", # unic-common 0.9.0
    "RUSTSEC-2025-0081", # unic-char-property 0.9.0
    "RUSTSEC-2025-0098", # unic-ucd-version 0.9.0
    "RUSTSEC-2025-0100", # unic-ucd-ident 0.9.0

    # NOTE — two advisories are waived in .cargo/audit.toml but deliberately NOT here,
    # because cargo-deny does not consider them applicable and listing them would only
    # produce a permanent `advisory-not-detected` warning:
    #   * RUSTSEC-2023-0071 (rsa, Marvin timing sidechannel) — sqlx-mysql is in
    #     Cargo.lock but never compiled (workspace sqlx = default-features = false,
    #     features = ["sqlite"]), so rsa is absent from the feature-resolved graph.
    #   * RUSTSEC-2024-0429 (glib 0.18.5, unsound VariantStrIter) — cargo-deny matches
    #     the advisory's `[affected.functions]` criteria and reports "no crate matched";
    #     linpodx has no `glib::` reference anywhere under crates/, so the affected
    #     iterators are genuinely unreachable. cargo-audit is function-blind and does
    #     report it, hence the audit-side waiver.
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

# linpodx本体 のライセンス
[[licenses.exceptions]]
allow = ["MIT"]
crate = "linpodx-common"

[[licenses.exceptions]]
allow = ["MIT"]
crate = "linpodx-runtime"

[[licenses.exceptions]]
allow = ["MIT"]
crate = "linpodx-sandbox"

[[licenses.exceptions]]
allow = ["MIT"]
crate = "linpodx-daemon"

[[licenses.exceptions]]
allow = ["MIT"]
crate = "linpodx-cli"

[[licenses.exceptions]]
allow = ["MIT"]
crate = "linpodx-gui"

# option-ext 1.x — MPL-2.0, pulled via dirs -> dirs-sys (tauri tree). File-level
# weak copyleft used unmodified as a dependency, so it imposes nothing on the
# MIT app code (MPL-2.0 §3.3 permits Larger Works under other licenses).
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "option-ext"

# Servo CSS crates — MPL-2.0, required by tauri-utils' dom_query (tauri injects
# its IPC bootstrap into app HTML at build time). Same legal position as
# option-ext: unmodified file-level weak copyleft, no effect on MIT app code.
# Scoped per-crate so any other MPL entrant still fails the gate.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "cssparser"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "cssparser-macros"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "dtoa-short"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "selectors"

# jsonpath-rust 0.5.1 ships an MIT LICENSE file but never set `license =` in its
# Cargo.toml. Pin the SPDX expression so cargo-deny does not emit a
# `license-not-encountered` warning for it. Upstream PR pending.
[[licenses.clarify]]
crate = "jsonpath-rust"
expression = "MIT"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6e },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
